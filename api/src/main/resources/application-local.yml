spring:
  config:
    activate:
      on-profile: local

  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:mopl}
    username: ${DB_USERNAME:mopl}
    password: ${DB_PASSWORD:}

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

  elasticsearch:
    uris: ${ELASTICSEARCH_URL:http://localhost:9200}

management:
  endpoint:
    health:
      show-details: always

ai:
  openai:
    base-url: https://api.openai.com/v1
    api-key: ${OPENAI_API_KEY:}
    llm-model: gpt-5.6-luna
    embedding-model: text-embedding-3-small
    connect-timeout: 5s
    read-timeout: 30s

jwt:
  secret: local-dev-secret-key-please-change-this-in-real-env-1234567890
  access-token-expiration-seconds: 1800
  refresh-token-expiration-seconds: 1209600
