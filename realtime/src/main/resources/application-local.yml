spring:
  config:
    activate:
      on-profile: local

  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:mopl}
    username: ${DB_USERNAME:mopl}
    password: ${DB_PASSWORD:}

  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

websocket:
  allowed-origins:
    - "http://localhost:*"
    - "http://127.0.0.1:*"

jwt:
  secret: local-dev-secret-key-please-change-this-in-real-env-1234567890
  access-token-expiration-seconds: 1800
  refresh-token-expiration-seconds: 1209600
