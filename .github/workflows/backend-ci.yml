name: Backend CI

on:
  pull_request:
    branches: [ develop, main ]
    paths:
      - 'api/**'
      - 'core/**'
      - 'infrastructure/**'
      - 'batch/**'
      - 'realtime/**'
      - 'build.gradle'
      - 'settings.gradle'
      - 'gradle/**'
      - 'gradlew'
      - 'gradle.properties'
      - '.github/workflows/backend-ci.yml'
  push:
    branches: [ develop ]
    paths:
      - 'api/**'
      - 'core/**'
      - 'infrastructure/**'
      - 'batch/**'
      - 'realtime/**'
      - 'build.gradle'
      - 'settings.gradle'
      - 'gradle/**'
      - 'gradlew'
      - 'gradle.properties'
      - '.github/workflows/backend-ci.yml'

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build with Gradle (includes test & jacocoTestReport)
        run: ./gradlew build jacocoTestReport

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: '**/build/reports/jacoco/**'

      - name: Publish test results
        if: always()
        uses: dorny/test-reporter@v1
        with:
          name: Test Results
          path: '**/build/test-results/test/*.xml'
          reporter: java-junit
