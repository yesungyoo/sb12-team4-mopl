plugins {
    id 'java'
    id 'org.springframework.boot' version '3.5.16' apply false
    id 'io.spring.dependency-management' version '1.1.7' apply false
    id 'jacoco'
    id "com.ewerk.gradle.plugins.querydsl" version "1.0.10" apply false
}

class MockitoAgentArgumentProvider implements org.gradle.process.CommandLineArgumentProvider {
    private final org.gradle.api.file.ConfigurableFileCollection agentClasspath

    MockitoAgentArgumentProvider(
            org.gradle.api.file.ConfigurableFileCollection agentClasspath
    ) {
        this.agentClasspath = agentClasspath
    }

    @org.gradle.api.tasks.Classpath
    org.gradle.api.file.ConfigurableFileCollection getAgentClasspath() {
        agentClasspath
    }

    @Override
    Iterable<String> asArguments() {
        ["-javaagent:${agentClasspath.singleFile.absolutePath}"]
    }
}

allprojects {
    group = 'com.mopl'
    version = '0.0.1-SNAPSHOT'

    repositories {
        mavenCentral()
    }
}

subprojects {
    apply plugin: 'java'
    apply plugin: 'io.spring.dependency-management'
    apply plugin: 'jacoco'

    java {
        toolchain {
            languageVersion = JavaLanguageVersion.of(21)
        }
    }

    dependencyManagement {
        imports {
            mavenBom 'org.springframework.boot:spring-boot-dependencies:3.5.16'
        }
    }

    dependencies {
        compileOnly 'org.projectlombok:lombok'
        annotationProcessor 'org.projectlombok:lombok'

        testImplementation 'org.springframework.boot:spring-boot-starter-test'

        testCompileOnly 'org.projectlombok:lombok'
        testAnnotationProcessor 'org.projectlombok:lombok'
    }

    tasks.withType(Test).configureEach {
        useJUnitPlatform()
        finalizedBy jacocoTestReport
    }

    jacocoTestReport {
        dependsOn test
        reports {
            xml.required = true
            html.required = true
        }
    }
}

project(':api') {
    configurations {
        mockitoAgent {
            canBeConsumed = false
            canBeResolved = true
            transitive = false
        }
    }

    dependencies {
        mockitoAgent 'org.mockito:mockito-core'
    }

    def mockitoAgentConfiguration = configurations.mockitoAgent
    tasks.withType(Test).configureEach {
        def agentFiles = objects.fileCollection()
        agentFiles.from(mockitoAgentConfiguration)

        jvmArgumentProviders.add(
                new MockitoAgentArgumentProvider(agentFiles)
        )
    }
}
